name: Refresh WNBA shot charts (manual)

# On-demand only — the automatic schedule moved to refresh-data.yml's daily
# job, which now runs fetch_shots.R itself. That used to be unsafe to run
# often (one bad game blocked the whole season's shot data on a single
# all-or-nothing check), so it was kept to a weekly cadence here. build_data.py
# now reconciles per (athlete, game) instead, so a straggler drops on its own
# without blocking anything else, and there's no reason to hold shot data back
# to once a week any more.
#
# What's left here: a manual trigger for an out-of-band full recompute — e.g.
# after a fix to the shot-zone calibration logic in fetch_shots.R itself, where
# you want to force-regenerate everything immediately rather than wait for the
# next daily run.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data          # share the daily job's group so the two never overlap
  cancel-in-progress: false

jobs:
  refresh-shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-wehoop-${{ runner.os }}-v2

      - name: Install R packages
        shell: Rscript {0}
        run: |
          pkgs <- c("wehoop", "dplyr", "readr", "arrow", "bit64")
          need <- pkgs[!vapply(pkgs, requireNamespace, logical(1), quietly = TRUE)]
          if (length(need)) install.packages(need)

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch fresh data (R → CSV)
        run: Rscript scripts/fetch_wnba.R

      - name: Fetch play-by-play → shot zones (R → CSV)
        run: Rscript scripts/fetch_shots.R

      - name: Rebuild snapshot (CSV → JSON, incl. fingerprints)
        run: python3 scripts/build_data.py ./data/csv ./src/data

      - name: Build and check invariants
        run: |
          npm ci --ignore-scripts   # icon tooling (sharp/@capacitor/assets) isn't needed to build the web app; skip its native build
          npm run build
          node scripts/smoke_refresh.mjs

      - name: Commit if the data changed
        run: |
          git config user.name  "courtside-data-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- src/data/app-data.json; then
            echo "No change in app-data.json — nothing to commit."
          else
            git add src/data/app-data.json
            git commit -m "data: manual shot-chart refresh $(date -u +%Y-%m-%d)"
            git push origin HEAD:${{ github.ref_name }}
            echo "Pushed refreshed snapshot."
          fi
