name: Refresh WNBA data

# Rebuilds src/data/app-data.json from fresh WNBA data and commits it if the
# numbers changed and still pass the invariant gate. Runs on GitHub's servers —
# nothing on your machine needs to be on.
on:
  schedule:
    - cron: '0 11 * * *'      # daily at 11:00 UTC (~morning in North America)
  workflow_dispatch:           # lets us (and you) run it on demand from the Actions tab

permissions:
  contents: write              # needed to push the refreshed snapshot back

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true   # install precompiled binaries — fast, no compiling

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-wehoop-${{ runner.os }}-v2

      - name: Install R packages
        shell: Rscript {0}
        # arrow is required: wehoop's ID columns are integer64 and only
        # materialise when the parquet path is used (arrow present). Without it
        # they read as NA. Skip packages already restored from cache so warm
        # runs are fast.
        run: |
          pkgs <- c("wehoop", "dplyr", "readr", "arrow", "bit64", "jsonlite")
          need <- pkgs[!vapply(pkgs, requireNamespace, logical(1), quietly = TRUE)]
          if (length(need)) install.packages(need)

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch fresh data (R → CSV)
        run: Rscript scripts/fetch_wnba.R

      - name: Fetch WNBA news (R → CSV)
        # Adds dim_news.csv (headlines + real story URLs) for the app's Wire.
        # Fully defensive and never fatal: on any failure build_data.py preserves
        # the previous news rather than blanking it.
        run: Rscript scripts/fetch_news.R || echo "news fetch step failed — continuing with preserved news"

      - name: Fetch per-quarter scores (R → CSV)
        # Adds fact_game_line.csv (linescores) for the game page's quarter table.
        # Defensive and non-fatal; build_data.py reconciles quarters to the final
        # score and preserves prior lines, so a miss never breaks the refresh.
        run: Rscript scripts/fetch_lines.R || echo "lines fetch step failed — continuing with preserved lines"

      - name: Rebuild snapshot (CSV → JSON)
        run: python3 scripts/build_data.py ./data/csv ./src/data

      - name: Build and check invariants
        run: |
          npm ci --ignore-scripts   # icon tooling (sharp/@capacitor/assets) isn't needed to build the web app; skip its native build
          npm run build
          node scripts/smoke_refresh.mjs

      - name: Commit if the data changed
        run: |
          git config user.name  "courtside-data-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Publish a copy for installed phones to fetch (served by GitHub Pages).
          cp src/data/app-data.json docs/app-data.json
          if git diff --quiet -- src/data/app-data.json docs/app-data.json; then
            echo "No change in app-data.json — nothing to commit."
          else
            git add src/data/app-data.json docs/app-data.json
            git commit -m "data: daily refresh $(date -u +%Y-%m-%d)"
            git push origin HEAD:${{ github.ref_name }}
            echo "Pushed refreshed snapshot."
          fi
