name: Refresh WNBA data

# Rebuilds src/data/app-data.json from fresh WNBA data and commits it if the
# numbers changed and still pass the invariant gate. Runs on GitHub's servers —
# nothing on your machine needs to be on.
on:
  schedule:
    - cron: '0 11 * * *'      # daily at 11:00 UTC (~morning in North America)
  workflow_dispatch:           # lets us (and you) run it on demand from the Actions tab

permissions:
  contents: write              # needed to push the refreshed snapshot back

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true   # install precompiled binaries — fast, no compiling

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-wehoop-${{ runner.os }}-v2

      - name: Install R packages
        shell: Rscript {0}
        # arrow is required: wehoop's ID columns are integer64 and only
        # materialise when the parquet path is used (arrow present). Without it
        # they read as NA. Skip packages already restored from cache so warm
        # runs are fast.
        run: |
          pkgs <- c("wehoop", "dplyr", "readr", "arrow", "bit64", "jsonlite")
          need <- pkgs[!vapply(pkgs, requireNamespace, logical(1), quietly = TRUE)]
          if (length(need)) install.packages(need)

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch fresh data (R → CSV)
        run: Rscript scripts/fetch_wnba.R

      - name: DIAG team advanced stats
        run: Rscript scripts/diag_team_advanced.R

      - name: Fetch WNBA news (R → CSV)
        # Adds dim_news.csv (headlines + real story URLs) for the app's Wire.
        # Fully defensive and never fatal: on any failure build_data.py preserves
        # the previous news rather than blanking it.
        run: Rscript scripts/fetch_news.R || echo "news fetch step failed — continuing with preserved news"

      - name: Fetch per-quarter scores (R → CSV)
        # Adds fact_game_line.csv (linescores) for the game page's quarter table.
        # Defensive and non-fatal; build_data.py reconciles quarters to the final
        # score and preserves prior lines, so a miss never breaks the refresh.
        run: Rscript scripts/fetch_lines.R || echo "lines fetch step failed — continuing with preserved lines"

      - name: Fetch injury status (R → CSV)
        # Adds dim_injuries.csv for the team/player pages. Defensive and non-fatal;
        # build_data.py preserves the prior report on a miss and clears a player's
        # status once ESPN no longer lists them, so it never shows a stale "Out".
        run: Rscript scripts/fetch_injuries.R || echo "injuries fetch step failed — continuing with preserved injuries"

      - name: Rebuild snapshot (CSV → JSON)
        run: python3 scripts/build_data.py ./data/csv ./src/data

      - name: Build and check invariants
        run: |
          npm ci --ignore-scripts   # icon tooling (sharp/@capacitor/assets) isn't needed to build the web app; skip its native build
          npm run build
          node scripts/smoke_refresh.mjs

      - name: Commit if the data changed
        id: commit
        run: |
          git config user.name  "courtside-data-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Publish a copy for installed phones to fetch (served by GitHub Pages).
          cp src/data/app-data.json docs/app-data.json
          if git diff --quiet -- src/data/app-data.json docs/app-data.json; then
            echo "No change in app-data.json — nothing to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            git add src/data/app-data.json docs/app-data.json
            git commit -m "data: daily refresh $(date -u +%Y-%m-%d)"
            git push origin HEAD:${{ github.ref_name }}
            echo "Pushed refreshed snapshot."
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

      # --- daily email summary --------------------------------------------------
      # Replaces manually checking the pipeline each day: this run always emails
      # raiappsdev@gmail.com a one-line status, success or failure, so a broken
      # refresh gets noticed the same day instead of silently going stale.
      #
      # Requires two repo secrets (Settings → Secrets and variables → Actions →
      # New repository secret) — neither is set yet, so the email step below is a
      # no-op (skipped, doesn't fail the run) until they exist:
      #   GMAIL_USERNAME      the Gmail address that SENDS the email (e.g. this
      #                       project's own raiappsdev@gmail.com)
      #   GMAIL_APP_PASSWORD  a 16-character Gmail "App Password" for that account
      #                       (Google Account → Security → 2-Step Verification →
      #                       App passwords) — NOT the normal account password;
      #                       Gmail requires this for SMTP.
      - name: Prepare daily summary
        if: always()
        id: meta
        env:
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMITTED: ${{ steps.commit.outputs.committed }}
        run: |
          python3 - <<'PYEOF'
          import json, os, datetime
          try:
              d = json.load(open("src/data/app-data.json"))
              m = d.get("meta", {})
              last_game, completed, total = m.get("lastGame"), m.get("completedGames"), m.get("totalGames")
              inj = len(d.get("INJ") or {})
          except Exception:
              last_game = completed = total = inj = None
          ok = os.environ.get("JOB_STATUS") == "success"
          subject = f"{'✅' if ok else '❌'} Courtside data refresh — {datetime.date.today().isoformat()}"
          lines = [f"Status: {'success' if ok else os.environ.get('JOB_STATUS', 'unknown')}"]
          lines.append(f"Data current through: {last_game or 'unknown'}")
          if completed is not None and total is not None:
              lines.append(f"Games: {completed} completed / {total} total")
          if inj:
              lines.append(f"Injury reports: {inj}")
          lines.append(f"Committed new data: {os.environ.get('COMMITTED', 'unknown')}")
          lines.append("")
          lines.append(os.environ["RUN_URL"])
          body = "\n".join(lines)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"subject={subject}\n")
              f.write("body<<EOF\n" + body + "\nEOF\n")
          PYEOF

      - name: Email daily summary
        if: always()
        continue-on-error: true   # a missing/bad SMTP secret should never mark the data refresh itself as failed
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: ${{ steps.meta.outputs.subject }}
          to: raiappsdev@gmail.com
          from: Courtside Data Bot <${{ secrets.GMAIL_USERNAME }}>
          body: ${{ steps.meta.outputs.body }}
